<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Design system components · Julian’s Guide to Interfaces</title>
  <link rel="stylesheet" href="design-system.css" />
  <style>
    /* Sheet chrome — presentation of the demo page, not part of the component spec. */
    @font-face { font-family: "Karl"; src: url("https://jfk.works/karl-regular.otf") format("opentype"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "Karl"; src: url("https://jfk.works/karl-medium.otf") format("opentype"); font-weight: 500; font-display: swap; }
    @font-face { font-family: "Karl"; src: url("https://jfk.works/karl-medium.otf") format("opentype"); font-weight: 600; font-display: swap; }
    @font-face { font-family: "Karl"; src: url("https://jfk.works/karl-bold.otf") format("opentype"); font-weight: 700; font-display: swap; }
    @font-face { font-family: "Karl"; src: url("https://jfk.works/karl-black.otf") format("opentype"); font-weight: 800; font-display: swap; }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--color-canvas); color: var(--color-text-primary); font-family: var(--font); }
    .sheet { max-width: 880px; margin: 0 auto; padding: 64px 24px 96px; }
    .eyebrow { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-placeholder); }
    .sheet-header { margin-bottom: 48px; }
    .sheet-header h1 { margin: 10px 0 0; font-size: clamp(32px, 5vw, 48px); font-weight: 800; line-height: 1.05; }
    .sheet-header p { max-width: 620px; margin: 16px 0 0; font-size: 15px; line-height: 1.65; color: var(--color-text-secondary); }
    .sheet-header code { font-size: 13px; background: var(--color-border-subtle); padding: 1px 5px; border-radius: 4px; }
    .sheet-section { margin-top: 40px; border: 1px solid var(--color-border-subtle); border-radius: 16px; background: var(--color-surface); overflow: hidden; }
    .sheet-section > header { padding: 24px 28px; border-bottom: 1px solid var(--color-border-subtle); }
    .sheet-section > header .eyebrow { color: var(--color-action-primary); }
    .sheet-section h2 { margin: 8px 0 0; font-size: 24px; font-weight: 700; line-height: 1.1; }
    .sheet-section > header p { max-width: 560px; margin: 10px 0 0; font-size: 13px; line-height: 1.6; color: var(--color-text-secondary); }
    .sheet-row { display: grid; grid-template-columns: 160px 1fr; gap: 24px; align-items: start; margin: 0; padding: 24px 28px; border-bottom: 1px solid var(--color-border-subtle); }
    .sheet-row:last-child { border-bottom: 0; }
    .sheet-row figcaption { padding-top: 8px; font-size: 13px; font-weight: 500; color: var(--color-text-secondary); }
    .sheet-stage { display: flex; flex-wrap: wrap; gap: 12px; padding: 24px; border: 1px solid var(--color-border-default); border-radius: 12px; background: var(--color-canvas); }
    .sheet-col { display: flex; flex-direction: column; gap: 12px; width: min(360px, 100%); }
    @media (max-width: 640px) { .sheet-row { grid-template-columns: 1fr; gap: 8px; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
